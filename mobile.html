<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tokyo Hunt</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>

.toggle{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:50%;border:2px solid #D8D2C8;background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}

.roundlink{border:0;background:var(--ink);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;cursor:pointer;flex:none;padding:0;text-decoration:none;box-sizing:border-box}

#archived-list .archivebtn{display:none}
.catlabel{flex:none;white-space:nowrap;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:var(--r-full)}
.flagbtn{border:0;background:var(--bg);font-size:15px;line-height:1;cursor:pointer;padding:0;width:32px;height:32px;border-radius:50%;flex:none;filter:grayscale(1);opacity:.5;display:grid;place-items:center}

.starbtn{border:0;background:var(--bg);font-size:15px;line-height:1;cursor:pointer;padding:0;width:32px;height:32px;border-radius:50%;flex:none;filter:grayscale(1);opacity:.5;display:grid;place-items:center}
.starbtn.active{filter:none;opacity:1;background:#FCEFC7}
.photo-wrap{margin-top:2px;border-radius:var(--r-md);overflow:hidden;background:var(--bg);min-height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.ctrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%}
.ctrack::-webkit-scrollbar{display:none}

.cnav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(21,20,31,.55);color:#fff;font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:2}
.cnav.prev{left:8px}
.cnav.next{right:8px}
.cdots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}
.cdots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.cdots span.active{background:#fff}
.photo-fallback{padding:20px 10px;text-align:center;color:var(--ink-soft);font-size:12px}
.photo-fallback a{color:var(--accent);font-weight:600}
.dist{color:var(--accent);font-weight:700}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:700;font-size:11px}
.stay-pin{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.stay-pin span{transform:rotate(45deg);font-size:18px}
.stay-tooltip{font-weight:700;background:var(--ink);color:#fff;border:0;padding:5px 10px;border-radius:var(--r-full);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px}
.stay-tooltip::before{border-top-color:var(--ink)}
.neigh-group-wrap{display:flex;align-items:flex-start;gap:2px;border-bottom:1px solid rgba(21,20,31,.08)}
.neigh-group-wrap .neigh-group{flex:1;min-width:0}
.group-actions{display:flex;gap:6px;flex:none;padding-top:14px}
.neigh-group{background:transparent;border:0;border-radius:0;margin:0;box-shadow:none}
.neigh-group>summary{padding:14px 4px;height:auto}
.neigh-group[open]>summary{padding-bottom:6px}
.group-name{flex:1;min-width:0;font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;flex-direction:column;gap:2px}
.group-meta{font-weight:600;font-size:11.5px;color:var(--ink-soft);letter-spacing:0}
.group-content{padding:0 0 8px 22px;border-left:2px solid var(--bg-alt);margin-left:8px}
.group-content .place{margin:8px 0}
.neigh-tooltip{background:transparent;border:0;box-shadow:none;padding:0;color:#5C6478;font-weight:800;font-size:11px;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 4px #fff}
.neigh-tooltip::before{display:none}
.sheet-backdrop{position:absolute;inset:0;isolation:isolate;background:rgba(21,20,31,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:2147483646}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;isolation:isolate;background:var(--card);border-radius:24px 24px 0 0;padding:8px 18px calc(78px + env(safe-area-inset-bottom));transform:translateY(102%) translateZ(0);transition:transform .25s ease;z-index:2147483646;max-height:82%;overflow-y:auto;box-shadow:0 -12px 30px rgba(21,20,31,.22)}
.sheet.open{transform:translateY(0) translateZ(0)}
.sheet-handle{width:36px;height:4px;background:#DADAEA;border-radius:2px;margin:6px auto 16px}
.sheet h2{font-size:15px;margin:0 0 10px;font-weight:800}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}

</style></head><body>
<header class="topbar">
  <div class="topbar-row">
    <div><h1>Tokyo Hunt</h1><p>Stay : <a href="https://www.google.com/maps/search/?api=1&query=35.6739,139.7351" target="_blank" rel="noopener">9h Akasaka</a></p></div>
    <div class="statuspill">
      <button class="statusdot" data-target="todo" type="button" aria-label="Yet to visit">📍<span class="sbadge" id="todoBadge">0</span></button>
      <button class="statusdot" data-target="starred" type="button" aria-label="Starred">⭐<span class="sbadge" id="starredBadge">0</span></button>
      <button class="statusdot" data-target="trips" type="button" aria-label="Day trips">🧳<span class="sbadge" id="tripsBadge">0</span></button>

      <button class="statusdot" data-target="archived" type="button" aria-label="Archived">📦<span class="sbadge" id="archivedBadge">0</span></button>
    </div>
  </div>
</header>
<main>
  <section id="listView" class="view active">
    <div id="listCarousel">
      <div class="listpage" id="page-todo"><div id="list"></div></div>
      <div class="listpage" id="page-starred"><h2 class="pagehead">⭐ Starred <span class="pagehead-count" id="starred-count">0</span></h2><div id="starred-list"></div></div>
      <div class="listpage" id="page-trips"><h2 class="pagehead">🧳 Day trips <span class="pagehead-count" id="trips-count">0</span></h2><div id="tripList"></div></div>
      <div class="listpage" id="page-visited"><h2 class="pagehead">🚩 Already Visited <span class="pagehead-count" id="visited-count">0</span></h2><div id="visited-list"></div></div>
      <div class="listpage" id="page-archived"><h2 class="pagehead">📦 Archived places <span class="pagehead-count" id="archive-count">0</span></h2><div id="archived-list"></div></div>
    </div>
  </section>
  <section id="mapView" class="view">

</main>
<nav class="bottomnav">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const CATS={arch:{label:'Architecture',short:'Arch',color:'#15141F'},hist:{label:'Architectural places',short:'Historic',color:'#7A5FB8'},food:{label:'Cafes & eateries',short:'Food',color:'#DB6B60'},trip:{label:'Day trips',short:'Trip',color:'#3E8E63'},neigh:{label:'Neighborhoods',short:'Area',color:'#7E88B0'}};
const ACCENT='#EE5A3C';
const hexToRgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`};

async function loadPhotos(p,wrap){
  if(wrap.dataset.loaded)return;
  wrap.dataset.loaded='1';
  const isch=`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p[1]+' '+p[3]+' Tokyo')}`;
  const fallback=()=>{wrap.innerHTML=`<div class="photo-fallback">No photos found automatically.<br><a target="_blank" href="${isch}">Search photos</a></div>`};
  const wikiPageImage=async(query)=>{
    try{
      const url=`https://en.wikipedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=600&format=json`;
      const res=await fetch(url);
      const data=await res.json();
      const pages=data && data.query && data.query.pages;
      const first=pages?Object.values(pages)[0]:null;
      return first && first.thumbnail && first.thumbnail.source;
    }catch(e){return null}
  };
  const commonsSearch=async(query,limit)=>{
    try{
      const url=`https://commons.wikimedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap '+query)}&gsrnamespace=6&gsrlimit=${limit}&prop=imageinfo&iiprop=url&iiurlwidth=500&format=json`;
      const res=await fetch(url);
      const data=await res.json();
      const pages=data && data.query && data.query.pages;
      if(!pages)return [];
      return Object.values(pages).map(pg=>pg.imageinfo && pg.imageinfo[0] && pg.imageinfo[0].thumburl).filter(Boolean);
    }catch(e){return []}
  };
  try{
    const urls=[];
    const wikiImg=await wikiPageImage(`${p[1]} ${p[3]} Tokyo`) || await wikiPageImage(p[1]);
    if(wikiImg)urls.push(wikiImg);
    const commonsImgs=await commonsSearch(`${p[1]} ${p[3]} Tokyo`,8);
    commonsImgs.forEach(u=>{if(urls.length<5 && !urls.includes(u))urls.push(u)});
    if(!urls.length){fallback();return}
    wrap.innerHTML=`<div class="ctrack">${urls.map(u=>`<img src="${u}" alt="${esc(p[1])}" loading="lazy">`).join('')}</div>${urls.length>1?`<button class="cnav prev" type="button" aria-label="Previous photo">‹</button><button class="cnav next" type="button" aria-label="Next photo">›</button><div class="cdots">${urls.map((_,i)=>`<span${i===0?' class="active"':''}></span>`).join('')}</div>`:''}`;
    if(urls.length>1){
      const track=wrap.querySelector('.ctrack'),dots=[...wrap.querySelectorAll('.cdots span')];
      const update=()=>{const idx=Math.round(track.scrollLeft/track.clientWidth);dots.forEach((d,i)=>d.classList.toggle('active',i===idx))};
      track.addEventListener('scroll',update,{passive:true});
      wrap.querySelector('.prev').onclick=e=>{e.stopPropagation();track.scrollBy({left:-track.clientWidth,behavior:'smooth'})};
      wrap.querySelector('.next').onclick=e=>{e.stopPropagation();track.scrollBy({left:track.clientWidth,behavior:'smooth'})};
    }
  }catch(e){fallback()}
}

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const WALK_KMH=4.8;
function walkMinutes(km){return Math.max(1,Math.round(km/WALK_KMH*60))}
const routeMap=L.map('routeMap',{zoomControl:true}).setView([STAY.lat,STAY.lon],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(routeMap);

const routeStatusEl=document.getElementById('routeStatus'),routeLegsEl=document.getElementById('routeLegs');
async function fetchWalkingLeg(fromLat,fromLon,toLat,toLon){
  const url=`https://router.project-osrm.org/route/v1/foot/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson&alternatives=true`;
  const res=await fetch(url);
  const data=await res.json();
  if(data.code!=='Ok'||!data.routes||!data.routes.length)throw new Error('no route');
  const r=data.routes.reduce((shortest,cand)=>cand.distance<shortest.distance?cand:shortest,data.routes[0]);
  return {latlngs:r.geometry.coordinates.map(c=>[c[1],c[0]]),km:r.distance/1000,mins:Math.round(r.duration/60)};
}
let routeRequestId=0;
let currentRouteStart=null,currentRouteStops=null;
async function buildRoute(startLat,startLon,startLabel,note){
  const myRequestId=++routeRequestId;
  routeLayer.clearLayers();
  routeLegsEl.innerHTML='';
  const picks=PLACES.filter(p=>selected.has(p[0]));
  if(!picks.length){
    routeStatusEl.textContent=(note?note+'. ':'')+'No places selected — select places from the list to build a route.';
    routeMap.setView([startLat,startLon],14);
    L.marker([startLat,startLon],{icon:L.divIcon({className:'',html:'<div class="geo-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(routeLayer).bindPopup(esc(startLabel));
    return;
  }
  const remaining=[...picks];
  let curLat=startLat,curLon=startLon,curLabel=startLabel;
  const stops=[];
  while(remaining.length){
    let bestIdx=0,bestDist=Infinity;
    remaining.forEach((p,i)=>{
      const d=haversineKm(curLat,curLon,p[4],p[5]);
      if(d<bestDist){bestDist=d;bestIdx=i}
    });
    const next=remaining.splice(bestIdx,1)[0];
    stops.push({fromLabel:curLabel,to:next,km:bestDist});
    curLat=next[4];curLon=next[5];curLabel=next[1];
  }
  const waypoints=[[startLat,startLon],...stops.map(s=>[s.to[4],s.to[5]])];
  currentRouteStart=[startLat,startLon];
  currentRouteStops=stops.map(s=>({lat:s.to[4],lon:s.to[5],name:s.to[1]}));
  const straightLatlngs=waypoints;
  L.polyline(straightLatlngs,{color:'#2E6ED9',weight:4,opacity:.5,dashArray:'1 8',lineCap:'round'}).addTo(routeLayer);
  L.marker([startLat,startLon],{icon:L.divIcon({className:'',html:'<div class="geo-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:1000}).addTo(routeLayer).bindPopup(esc(startLabel));
  stops.forEach(s=>{
    L.marker([s.to[4],s.to[5]],{icon:L.divIcon({className:'',html:`<div class="route-pin">${s.to[0]}</div>`,iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:900}).addTo(routeLayer).bindPopup(`<b>${s.to[0]}. ${esc(s.to[1])}</b>`);
  });
  routeMap.fitBounds(waypoints,{padding:[30,30]});
  routeStatusEl.textContent=(note?note+'. ':'')+'Calculating walking route…';
  renderLegs(stops,true);
  const legResults=await Promise.all(stops.map((s,i)=>fetchWalkingLeg(waypoints[i][0],waypoints[i][1],waypoints[i+1][0],waypoints[i+1][1]).catch(()=>null)));
  if(myRequestId!==routeRequestId)return;
  routeLayer.clearLayers();
  L.marker([startLat,startLon],{icon:L.divIcon({className:'',html:'<div class="geo-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:1000}).addTo(routeLayer).bindPopup(esc(startLabel));
  legResults.forEach((leg,i)=>{
    const s=stops[i];
    if(leg){
      L.polyline(leg.latlngs,{color:'#2E6ED9',weight:4,opacity:.85,lineCap:'round'}).addTo(routeLayer);
      s.km=leg.km;s.mins=walkMinutes(s.km);s.roadFollowing=true;
    }else{
      L.polyline([waypoints[i],waypoints[i+1]],{color:'#2E6ED9',weight:4,opacity:.5,dashArray:'1 8',lineCap:'round'}).addTo(routeLayer);
      s.mins=walkMinutes(s.km);s.roadFollowing=false;
    }
  });
  stops.forEach(s=>{
    L.marker([s.to[4],s.to[5]],{icon:L.divIcon({className:'',html:`<div class="route-pin">${s.to[0]}</div>`,iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:900}).addTo(routeLayer).bindPopup(`<b>${s.to[0]}. ${esc(s.to[1])}</b><br><span class="dist">${s.km.toFixed(1)} km</span> · ${s.mins} min walk`);
  });
  routeStatusEl.textContent=note||'';
  renderLegs(stops,false);
}
function renderLegs(stops,pending){
  routeLegsEl.innerHTML='';
  const header=document.createElement('div');
  header.className='route-legs-header';
  header.innerHTML=`<span class="route-legs-title">Walking route · ${stops.length} stop${stops.length===1?'':'s'}</span><button id="openGmapsBtn" class="gmaps-btn" type="button">🗺️ Google Maps</button>`;
  routeLegsEl.appendChild(header);
  stops.forEach(s=>{
    const row=document.createElement('div');
    row.className='route-leg';
    const meta=pending?'calculating…':`${s.km.toFixed(1)} km · ${s.mins} min walk${s.roadFollowing?'':' (approx)'}`;
    row.innerHTML=`<span class="route-leg-num">${s.to[0]}</span><div class="route-leg-info"><div class="route-leg-name">${esc(s.fromLabel)} → ${esc(s.to[1])}</div><div class="route-leg-meta">${meta}</div></div>`;
    routeLegsEl.appendChild(row);
  });
}
routeLegsEl.addEventListener('click',e=>{
  const btn=e.target.closest('#openGmapsBtn');
  if(!btn)return;
  if(!currentRouteStart||!currentRouteStops||!currentRouteStops.length){alert('No route to open yet.');return}
  const GMAPS_MAX_WAYPOINTS=9;
  const stopsToUse=currentRouteStops.slice(0,GMAPS_MAX_WAYPOINTS+1);
  const truncated=currentRouteStops.length>stopsToUse.length;
  const destination=stopsToUse[stopsToUse.length-1];
  const waypointStops=stopsToUse.slice(0,-1);
  const origin=`${currentRouteStart[0]},${currentRouteStart[1]}`;
  const dest=`${destination.lat},${destination.lon}`;
  let url=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=walking`;
  if(waypointStops.length)url+=`&waypoints=${encodeURIComponent(waypointStops.map(w=>`${w.lat},${w.lon}`).join('|'))}`;
  if(truncated)alert(`Google Maps supports up to ${GMAPS_MAX_WAYPOINTS+1} stops — opening the first ${stopsToUse.length} of ${currentRouteStops.length}.`);
  window.open(url,'_blank');
});
function enterRouteView(){
  if(!navigator.geolocation){
    buildRoute(STAY.lat,STAY.lon,'Your stay',STAY.name+' — geolocation not supported, starting from your hotel');
    return;
  }
  routeStatusEl.textContent='Finding your location…';
  navigator.geolocation.getCurrentPosition(pos=>{
    buildRoute(pos.coords.latitude,pos.coords.longitude,'Your location');
  },err=>{
    buildRoute(STAY.lat,STAY.lon,'Your stay','Could not get your location — starting from your hotel instead');
  },{enableHighAccuracy:true,timeout:10000});
}

</script><script>
(()=>{
  const sheetActions=document.querySelector('.sheet-actions'),ARCH_KEY='tokyo-archived-ids';
  let archiveSet;
  try{archiveSet=new Set(JSON.parse(localStorage.getItem(ARCH_KEY)||'[]'))}catch(e){archiveSet=new Set()}
  const button=document.createElement('button'),restoreAllBtn=document.createElement('button');
  button.id='archive-selected';button.type='button';button.textContent='Archive selected';sheetActions.appendChild(button);
  restoreAllBtn.id='unarchive-selected';restoreAllBtn.type='button';restoreAllBtn.textContent='Unarchive selected';sheetActions.appendChild(restoreAllBtn);
  const archiveList=document.getElementById('archived-list'),archiveCount=document.getElementById('archive-count');
  const persist=()=>localStorage.setItem(ARCH_KEY,JSON.stringify([...archiveSet]));
  const update=()=>{archiveCount.textContent=archiveSet.size;persist();updateStatusBadges()};
  function addRestoreBtn(card){
    if(card.querySelector('[data-restore]'))return;
    const actions=card.querySelector('.links'),restore=document.createElement('button');
    restore.type='button';restore.dataset.restore='';restore.textContent='Restore to itinerary';
    actions.appendChild(restore);
  }
  function archiveOne(card){
    const id=+card.dataset.id;
    if(archiveSet.has(id))return;
    archiveSet.add(id);archiveList.appendChild(card);card.open=false;addRestoreBtn(card);
    const toggle=card.querySelector('.toggle');
    if(toggle.checked){toggle.checked=false;toggle.dispatchEvent(new Event('change'))}
    window.autoUnstar&&window.autoUnstar(id);
    update();
  }
  document.body.addEventListener('click',e=>{
    const btn=e.target.closest('.archivebtn');
    if(!btn)return;
    e.preventDefault();e.stopPropagation();
    const groupWrap=btn.closest('.neigh-group-wrap');
    if(groupWrap){
      const g=GROUPS.find(x=>x.name===groupWrap.dataset.group);
      if(g)g.ids.forEach(id=>{
        const card=document.querySelector(`#list details.place[data-id="${id}"], #starred-list details.place[data-id="${id}"]`);
        if(card)archiveOne(card);
      });
      return;
    }
    archiveOne(btn.closest('details.place'));
  });
  button.onclick=()=>{
    [...document.querySelectorAll('#list details.place, #tripList details.place, #starred-list details.place')].filter(card=>card.querySelector('.toggle').checked).forEach(card=>{
      const id=+card.dataset.id;
      archiveSet.add(id);archiveList.appendChild(card);card.open=false;addRestoreBtn(card);
      const toggle=card.querySelector('.toggle');
      toggle.checked=false;toggle.dispatchEvent(new Event('change'));
      window.autoUnstar&&window.autoUnstar(id);
    });
    update();
  };
  restoreAllBtn.onclick=()=>{
    [...archiveList.querySelectorAll('details.place')].filter(card=>card.querySelector('.toggle').checked).forEach(card=>{
      archiveSet.delete(+card.dataset.id);
      homeGroupContent(+card.dataset.id).appendChild(card);
      const toggle=card.querySelector('.toggle');
      toggle.checked=true;
      toggle.dispatchEvent(new Event('change'));
    });
    update();
  };
  archiveList.addEventListener('click',e=>{
    const restore=e.target.closest('button[data-restore]');
    if(!restore)return;
    const card=restore.closest('details');
    archiveSet.delete(+card.dataset.id);
    homeGroupContent(+card.dataset.id).appendChild(card);
    card.querySelector('.toggle').checked=true;
    card.querySelector('.toggle').dispatchEvent(new Event('change'));
    update();
  });
  let deselectedAny=false;
  document.querySelectorAll('#list details.place, #tripList details.place').forEach(card=>{
    if(archiveSet.has(+card.dataset.id)){
      archiveList.appendChild(card);card.open=false;addRestoreBtn(card);
      const id=+card.dataset.id;
      if(selected.has(id)){selected.delete(id);card.querySelector('.toggle').checked=false;deselectedAny=true}
    }
  });
  archiveCount.textContent=archiveSet.size;
  updateStatusBadges();
  if(deselectedAny)redraw();
})();
</script><script>
(()=>{
  const STORAGE_KEY='tokyo-visited-ids';
  let visited;
  try{visited=new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'))}catch(e){visited=new Set()}
  const visitedList=document.getElementById('visited-list'),visitedCount=document.getElementById('visited-count');
  const persist=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify([...visited]));
  const updateCount=()=>{visitedCount.textContent=visited.size;updateStatusBadges()};
  function place(card,isVisited){
    card.querySelector('.flagbtn').classList.toggle('active',isVisited);
    if(isVisited)visitedList.appendChild(card);
    else homeGroupContent(+card.dataset.id).appendChild(card);
  }
  function setVisited(card,isVisited){
    const id=+card.dataset.id;
    isVisited?visited.add(id):visited.delete(id);
    place(card,isVisited);
    if(isVisited)window.autoUnstar&&window.autoUnstar(id);
    persist();updateCount()
  }
  document.querySelectorAll('#list details.place, #tripList details.place, #archived-list details.place').forEach(card=>{if(visited.has(+card.dataset.id))place(card,true)});
  document.body.addEventListener('click',e=>{
    const btn=e.target.closest('.flagbtn');
    if(!btn)return;
    e.preventDefault();e.stopPropagation();
    const groupWrap=btn.closest('.neigh-group-wrap');
    if(groupWrap){
      const g=GROUPS.find(x=>x.name===groupWrap.dataset.group);
      if(g)g.ids.forEach(id=>{
        const card=document.querySelector(`#list details.place[data-id="${id}"], #starred-list details.place[data-id="${id}"]`);
        if(card)setVisited(card,true);
      });
      return;
    }
    const card=btn.closest('details.place'),id=+card.dataset.id;
    setVisited(card,!visited.has(id))
  });
  updateCount();
})();
</script><script>
(()=>{
  const STORAGE_KEY='tokyo-starred-ids';
  let starred;
  try{starred=new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'))}catch(e){starred=new Set()}
  const starredListEl=document.getElementById('starred-list'),starredCountEl=document.getElementById('starred-count');
  const persist=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify([...starred]));
  const updateCount=()=>{starredCountEl.textContent=starred.size;updateStatusBadges()};
  function place(card,isStarred){
    card.querySelector('.starbtn').classList.toggle('active',isStarred);
    if(isStarred)starredListEl.appendChild(card);
    else homeGroupContent(+card.dataset.id).appendChild(card);
  }
  function setStarred(card,isStarred){
    const id=+card.dataset.id;
    isStarred?starred.add(id):starred.delete(id);
    place(card,isStarred);
    persist();updateCount();
  }
  let selfCleaned=false;
  document.querySelectorAll('#archived-list details.place, #visited-list details.place').forEach(card=>{
    const id=+card.dataset.id;
    if(starred.has(id)){starred.delete(id);selfCleaned=true}
  });
  if(selfCleaned)persist();
  document.querySelectorAll('#list details.place, #tripList details.place').forEach(card=>{
    if(starred.has(+card.dataset.id))place(card,true);
  });
  document.body.addEventListener('click',e=>{
    const btn=e.target.closest('.starbtn');
    if(!btn)return;
    e.preventDefault();e.stopPropagation();
    const card=btn.closest('details.place'),id=+card.dataset.id;
    setStarred(card,!starred.has(id));
  });
  window.autoUnstar=function(id){
    if(!starred.has(id))return;
    starred.delete(id);
    document.querySelectorAll(`details.place[data-id="${id}"] .starbtn`).forEach(b=>b.classList.remove('active'));
    persist();updateCount();
  };
  updateCount();
})();
</script></body></html>
