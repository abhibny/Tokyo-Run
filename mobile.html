<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tokyo Itinerary</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#F7F3EF;--bg-alt:#EDE6DE;--card:#FFFFFF;--ink:#15141F;--ink-soft:#8A8078;--accent:#EE5A3C;--accent-soft:rgba(93,95,219,.14);--shadow:0 8px 20px rgba(28,26,58,.09);--r-lg:20px;--r-md:14px;--r-full:999px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow:hidden}
header.topbar{flex:none;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(180deg,#F2643C,#F7F3EF)}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar-row h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
.topbar-row p{margin:2px 0 0;font-size:11.5px;color:#3D3B52;font-weight:500}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:18px;cursor:pointer;flex:none}
.badge{position:absolute;top:-3px;right:-3px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;line-height:1}
.segmented{display:flex;background:rgba(255,255,255,.55);border-radius:var(--r-full);padding:4px;margin-top:14px;gap:4px}
.seg-btn{flex:1;border:0;background:transparent;padding:10px 0;border-radius:var(--r-full);font-weight:700;font-size:13.5px;color:#4A4860;font-family:inherit}
.seg-btn.active{background:var(--ink);color:#fff}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
#listView{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
#map{height:100%;width:100%}
.legend{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:var(--r-full);padding:8px 14px;display:flex;gap:12px;justify-content:space-around;box-shadow:var(--shadow);font-size:10.5px;font-weight:600;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}
details{background:var(--card);border:0;border-radius:var(--r-lg);margin:0 0 10px;box-shadow:var(--shadow);overflow:hidden}
details.dim{opacity:.4}
summary{list-style:none;display:flex;align-items:center;gap:7px;padding:0 12px;height:56px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.chevron{font-size:14px;transition:transform .15s;color:var(--ink-soft);width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
details[open] .chevron{transform:rotate(90deg)}
.name{flex:1;min-width:0;font-weight:700;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{width:20px;height:20px;accent-color:var(--accent);flex:none}
.details-content{padding:0 14px 16px 42px}
.details-content p{margin:4px 0 10px;color:var(--ink-soft);font-size:13px;line-height:1.6}
.details-content p b{color:var(--ink);font-size:15.5px;display:block;margin-bottom:3px;font-weight:700}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{padding:10px 16px;color:#fff;background:var(--ink);text-decoration:none;border-radius:var(--r-full);font-size:13px;font-weight:600}
.catlabel{flex:none;white-space:nowrap;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:var(--r-full)}
.flagbtn{border:0;background:var(--bg);font-size:15px;line-height:1;cursor:pointer;padding:0;width:32px;height:32px;border-radius:50%;flex:none;filter:grayscale(1);opacity:.5;display:grid;place-items:center}
.flagbtn.active{filter:none;opacity:1;background:#F0D9D6}
.photo-wrap{margin-top:2px;border-radius:var(--r-md);overflow:hidden;background:var(--bg);min-height:150px;display:flex;align-items:center;justify-content:center}
.photo{width:100%;max-height:220px;object-fit:cover;display:block}
.photo-fallback{padding:20px 10px;text-align:center;color:var(--ink-soft);font-size:12px}
.photo-fallback a{color:var(--accent);font-weight:600}
.dist{color:var(--accent);font-weight:700}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:700;font-size:11px}
.stay-pin{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.stay-pin span{transform:rotate(45deg);font-size:18px}
.stay-tooltip{font-weight:700;background:var(--ink);color:#fff;border:0;padding:5px 10px;border-radius:var(--r-full);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px}
.stay-tooltip::before{border-top-color:var(--ink)}
#archive-box,#visited-box{background:var(--bg-alt);box-shadow:none}
.neigh-group{background:transparent;border:0;border-radius:0;margin:0;box-shadow:none;border-bottom:1px solid rgba(21,20,31,.08)}
.neigh-group>summary{padding:14px 4px;height:auto}
.neigh-group[open]>summary{padding-bottom:6px}
.group-name{flex:1;min-width:0;font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;flex-direction:column;gap:2px}
.group-meta{font-weight:600;font-size:11.5px;color:var(--ink-soft);letter-spacing:0}
.group-content{padding:0 0 8px 22px;border-left:2px solid var(--bg-alt);margin-left:8px}
.group-content .place{margin:8px 0}
.neigh-tooltip{background:transparent;border:0;box-shadow:none;padding:0;color:#5C6478;font-weight:800;font-size:11px;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 4px #fff}
.neigh-tooltip::before{display:none}
.sheet-backdrop{position:fixed;inset:0;background:rgba(21,20,31,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .25s ease;z-index:21;max-height:82vh;overflow-y:auto;box-shadow:0 -12px 30px rgba(21,20,31,.22)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#DADAEA;border-radius:2px;margin:6px auto 16px}
.sheet h2{font-size:15px;margin:0 0 10px;font-weight:800}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.sheet-actions button{padding:12px 10px;border:0;border-radius:14px;background:var(--bg);cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);font-family:inherit}
.sheet-actions button:active{background:var(--accent-soft)}
#archive-unselected{grid-column:1/-1}
.cats{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.catbtn{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;border:0;background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);font-family:inherit;text-align:left}
.catbtn.off{opacity:.4}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
#closeSheet{width:100%;padding:13px;border:0;border-radius:var(--r-full);background:var(--ink);color:#fff;font-weight:700;font-size:14px;font-family:inherit;margin-top:4px}

    const url=`https://en.wikipedia.org/w/api.php?origin=*&action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=600&format=json`;
    const res=await fetch(url);
    const data=await res.json();
    const pages=data && data.query && data.query.pages;

  list.after(box);
  const visitedList=document.getElementById('visited-list'),visitedCount=document.getElementById('visited-count');
  const persist=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify([...visited]));
  const updateCount=()=>visitedCount.textContent=visited.size;
  function place(card,isVisited){
    card.querySelector('.flagbtn').classList.toggle('active',isVisited);
    if(isVisited)visitedList.appendChild(card);
    else homeGroupContent(+card.dataset.id).appendChild(card);
  }
  function setVisited(card,isVisited){
    const id=+card.dataset.id;
    isVisited?visited.add(id):visited.delete(id);
    place(card,isVisited);
    persist();updateCount()
  }
  document.querySelectorAll('#list details.place, #archived-list details.place').forEach(card=>{if(visited.has(+card.dataset.id))place(card,true)});
  document.body.addEventListener('click',e=>{
    const btn=e.target.closest('.flagbtn');
    if(!btn)return;
    e.preventDefault();e.stopPropagation();
    const card=btn.closest('details'),id=+card.dataset.id;
    setVisited(card,!visited.has(id))
  });
  updateCount();
})();
</script></body></html>
